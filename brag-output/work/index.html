'use strict';
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
// visibility window: fades in over [a,a+fi], out over [b-fo,b]
const win=(t,a,b,fi=.4,fo=.3)=>Math.min(eOut(prog(t,a,a+fi)),1-eIn(prog(t,b-fo,b)));
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e};
const css=(e,o)=>{for(const k in o)e.style[k]=o[k]};

function mask(root,x,y,w,h,color,r=12){
  const e=el('div','',root);

}

  return e;

    const rows=[[1572,17.5],[1644,18.125],[1714,18.75]].map(([y,t0])=>{const m=mask(root,628,y,470,66,'#f4efdb',8);return [m,t0]});
    const badge=mask(root,900,1796,400,86,'#f4efdb',40);
    const glow=el('div','',root);css(glow,{position:'absolute',left:'900px',top:'1796px',width:'400px',height:'86px',borderRadius:'44px',
      boxShadow:'0 0 0 0 rgba(46,138,98,.0)',opacity:0});
    const scan=el('div','',root);css(scan,{position:'absolute',left:'96px',width:'1248px',height:'14px',borderRadius:'7px',
      background:'linear-gradient(90deg,rgba(255,215,120,0),#FFD36E 20%,#fff 50%,#FFD36E 80%,rgba(255,215,120,0))',
      boxShadow:'0 0 40px 16px rgba(255,205,100,.55)',opacity:0});
    const spark=el('div','',root,'✦');css(spark,{position:'absolute',fontSize:'90px',color:'#E7B84B',opacity:0,textShadow:'0 0 30px #fff'});

      for(const [m,t0] of rows){const p=eIO(prog(t,t0,t0+.38));m.style.transform=`translateX(${p*490}px)`;m.style.width=(470*(1-p)+1)+'px';m.style.opacity=p>=1?0:1}

      spark.style.left=(150+eIO(sp)*1050)+'px';spark.style.top=(1350+eIO(sp)*500)+'px';spark.style.opacity=(sp>0&&sp<1)?Math.min(1,sp*6,(1-sp)*6)*(.6+.4*Math.sin(t*20)):0;

  stock(root){

    };

  whats(root){
    mask(root,322,1936,792,166,'#e2e7ca',14);

    return ()=>{};
  },
  assist(root){
    const m=mask(root,150,1985,1000,96,'#f8f5eb',10);m.style.opacity=0;

    const tx=text(root,160,2004,'',{fontWeight:'600',fontSize:'42px',color:'#39432C'});
    const caret=el('div','',root);css(caret,{position:'absolute',top:'2002px',width:'5px',height:'54px',background:'#2E8A62',opacity:0});
    return t=>{
      const on=t>=37.75&&t<39.45;m.style.opacity=on?1:0;
      const n=Math.round(clamp((t-37.8125)/1.25)*q.length);tx.textContent=on?q.slice(0,n):'';
      caret.style.left=(165+tx.offsetWidth)+'px';caret.style.opacity=on&&(Math.floor(t*3.2)%2===0||n<q.length)?1:0;
    };
  },
  doctors(root){
    const r=el('div','',root);css(r,{position:'absolute',left:'663px',top:'1080px',width:'120px',height:'60px',borderRadius:'50%'});
    return t=>{
      const ph=((t-42.5)%BEAT)/BEAT;r.style.boxShadow=`0 0 0 ${ph*60}px rgba(30,96,62,${.5*(1-ph)})`;
    };
  },
};
class ScreenView{
  constructor(id,parent){
    this.id=id;this.el=el('div','scr',parent);
    const img=el('img','base',this.el);img.src='screens/'+FILES[id];
    this.upd=OVERLAYS[id]?OVERLAYS[id](this.el):()=>{};
    this.taps=(TAPS[id]||[]).map(([x,y,t0])=>{
      const ring=el('div','tapring',this.el),dot=el('div','tapdot',this.el);return {x,y,t0,ring,dot};
    });
  }
  update(t){
    this.upd(t);
    for(const k of this.taps){
      const d=t-k.t0;
      if(d<-.18||d>.75){k.dot.style.opacity=0;k.ring.style.opacity=0;continue}
      const press=d<0?1.25-(d+.18)/.18*.3:.95;
      const dr=110*press;css(k.dot,{width:dr+'px',height:dr+'px',left:(k.x-dr/2)+'px',top:(k.y-dr/2)+'px',
        opacity:d<0?eOut((d+.18)/.18):1-eIn(prog(d,.2,.55))});
      const rp=prog(d,0,.6),rr=110+eOut(rp)*190;
      css(k.ring,{width:rr+'px',height:rr+'px',left:(k.x-rr/2)+'px',top:(k.y-rr/2)+'px',opacity:d<0?0:(1-rp)*.9});
    }
  }
}

  return {cur:NAV[i][1],prev:i>0&&p<1?NAV[i-1][1]:null,p};
}

// ---------- callouts ----------
class Callout{
  constructor(id,crop,x,y,w,a,b){
    const [cx,cy,cw,ch]=crop;this.k=w/cw;this.a=a;this.b=b;
    this.box=el('div','callout');css(this.box,{left:x+'px',top:y+'px',width:w+'px',height:Math.round(ch*this.k)+'px'});
    this.v=new ScreenView(id,this.box);this.v.el.style.transform=`translate(${-cx*this.k}px,${-cy*this.k}px) scale(${this.k})`;
    // taps belong to the phone, not to the magnified copy
    for(const tp of this.v.taps){tp.dot.remove();tp.ring.remove()}this.v.taps=[];
  }
  update(t){
    const vis=t>this.a-.05&&t<this.b;this.box.style.display=vis?'block':'none';if(!vis)return;
    const pi=prog(t,this.a,this.a+.45),po=prog(t,this.b-.3,this.b);
    const s=lerp(.82,1,eBack(pi))*lerp(1,.92,eIn(po));
    this.box.style.opacity=Math.min(eOut(pi*1.6),1-eIn(po));
    this.box.style.transform=`translateY(${(1-eOut(pi))*50-eIn(po)*30}px) scale(${s})`;
    this.v.update(t);
  }
}

const outroPills=el('div','cap',null,['Receita com IA','Lembretes no WhatsApp','Estoque','Médicos','Sintomas'].map(s=>`<span class="pill">${s}</span>`).join(''));
css(outroPills,{top:'1475px',padding:'0 70px'});

// z-order: splash and its veil at the back, leaves over them, phones above captions
stage.prepend(splash,veil,...leaves.map(l=>l.i));
stage.appendChild(sidePhones[0].p);stage.appendChild(sidePhones[1].p);stage.appendChild(phone.p);
for(const c of CALLOUTS)stage.appendChild(c.box);stage.appendChild(wa);
const sideV=[view(sidePhones[0],'meds'),view(sidePhones[1],'assist')];

// ---------- frame ----------
function renderFrame(t){
  // leaves sway
  for(const [i,l] of leaves.entries())l.i.style.transform=`rotate(${l.r+Math.sin(t*.9+i*1.7)*2.2}deg)`;

  // scene 1
  for(const k of NOTIFS){
    const pi=prog(t,k.t0-.12,k.t0+.4),po=prog(t,4.4,4.8);
    k.n.style.opacity=t<k.t0-.12?0:Math.min(eOut(pi*1.5),1-po);
    k.n.style.transform=`translateY(${k.y-(1-eBack(pi))*110-eIn(po)*700}px) rotate(${k.rot*(1-pi)*3+k.rot}deg) scale(${lerp(.9,1,eOut(pi))})`;
  }
  const hp=prog(t,2.8125,3.2);hookH.style.top='1170px';
  hookH.style.opacity=Math.min(eOut(hp),1-prog(t,4.5,4.8));
  hookH.style.transform=`translateY(${(1-eOut(hp))*40}px) scale(${lerp(.94,1,eOut(hp))*lerp(1,.9,eIn(prog(t,4.5,4.8)))})`;

  // scene 2
  const sIn=prog(t,4.8,5.35);
  splash.style.opacity=t<4.8||t>10.2?0:eOut(sIn);
  splash.style.transform=`scale(${lerp(1.14,1.0,eOut(sIn))+prog(t,5.35,10)*.05})`;
  veil.style.opacity=t<8.6?(t<4.8?1:1-eOut(sIn)):eIO(prog(t,8.6,9.6));
  const tp=prog(t,5.625,6.1),tt=prog(t,6.25,6.7),to=prog(t,8.45,8.85);
  title.style.top='250px';title.style.opacity=t<5.6||t>8.9?0:Math.min(eOut(tp),1-eIn(to));
  title.children[0].style.transform=`translateY(${(1-eOut(tp))*40}px)`;
  title.children[1].style.opacity=eOut(tt);title.children[1].style.transform=`translateY(${(1-eOut(tt))*24}px)`;

  // phone
  const outro=prog(t,50,51);
  const rise=eOut(prog(t,8.75,10));
  const show=t>=8.75;
  phone.p.style.display=show?'block':'none';
  if(show){
    const oy=lerp(PH.y,640,eIO(outro)),os=lerp(1,.66,eIO(outro));
    phone.p.style.left=PH.x+'px';phone.p.style.top=oy+'px';
    phone.p.style.transform=`translateY(${(1-rise)*1500}px) scale(${os})`;
    phone.p.style.transformOrigin='50% 0';
    const ns=navState(t);
    for(const id in phone.views)phone.views[id].el.style.display='none';
    const cur=view(phone,ns.cur);cur.el.style.display='block';cur.update(t);
    cur.el.style.transform=`translateX(${(1-ns.p)*640}px) scale(${SCALE})`;cur.el.style.zIndex=2;cur.el.style.filter='none';
    if(ns.prev&&ns.prev!==ns.cur){const pv=view(phone,ns.prev);pv.el.style.display='block';pv.update(t);
      pv.el.style.transform=`translateX(${-ns.p*200}px) scale(${SCALE})`;pv.el.style.zIndex=1;pv.el.style.filter=`brightness(${1-ns.p*.3})`}
    else if(ns.prev===ns.cur){cur.el.style.transform=`scale(${SCALE})`}
  }
  // side phones (outro)
  sidePhones.forEach((sp,i)=>{
    const p=eOut(prog(t,50.3125+i*.15,51.2+i*.15));const vis=t>=50.3;sp.p.style.display=vis?'block':'none';if(!vis)return;
    const dir=i?1:-1;
    css(sp.p,{left:(PH.x+dir*270)+'px',top:'700px',transformOrigin:'50% 0',opacity:p});
    sp.p.style.transform=`translateX(${dir*(1-p)*500}px) rotate(${dir*9*p}deg) scale(.6)`;
    sideV[i].update(t);
  });
  // captions
  for(const c of CAPS){
    const vis=t>c.a&&t<c.b;c.c.style.display=vis?'block':'none';if(!vis)continue;
    const pi=prog(t,c.a+.08,c.a+.5),po=prog(t,c.b-.32,c.b);
    c.c.style.opacity=Math.min(eOut(pi),1-eIn(po));
    c.c.style.transform=`translateY(${(1-eOut(pi))*36-eIn(po)*30}px)`;
  }
  for(const c of CALLOUTS)c.update(t);
  // whatsapp card
  const wv=t>33.3&&t<37.5;wa.style.display=wv?'block':'none';
  if(wv){const pi=prog(t,33.375,33.8),po=prog(t,37.2,37.5);wa.style.opacity=Math.min(eOut(pi),1-eIn(po));
    wa.style.transform=`translateY(${(1-eOut(pi))*50}px) scale(${lerp(.9,1,eBack(pi))})`;
    for(const b of BUBS){const p=prog(t,b.t0,b.t0+.35);b.b.style.display=t<b.t0?'none':'block';b.b.style.opacity=eOut(p);b.b.style.transform=`scale(${lerp(.7,1,eBack(p))})`}}
  // outro text
  const oi=prog(t,50.625,51.1),ot=prog(t,51.0,51.5),opl=prog(t,51.5625,52.0);
  outroIcon.style.opacity=t<50.6?0:eOut(oi);outroIcon.style.transform=`scale(${t<50.6?0:eBack(oi)})`;
  outroT.style.opacity=t<50.9?0:eOut(ot);outroT.style.transform=`translateY(${(1-eOut(ot))*30}px)`;
  outroPills.style.opacity=t<51.5?0:eOut(opl);outroPills.style.transform=`translateY(${(1-eOut(opl))*30}px)`;
}
// hide outro elements until needed is handled by opacity; build all lazily-created views up front
for(const [,id] of NAV)view(phone,id);
window.renderFrame=renderFrame;
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>document.fonts.load('900 40px N'));
renderFrame(0);
</script>
</body>
</html>
